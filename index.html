<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login with sesionStorage and localStorage</title>
</head>

<body>
  <form action="" id="form">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required />
    <label for="age">Age:</label>
    <input type="number" id="age" name="age" required />
    <button type="submit" id="save-data">Save information</button>
    <label for="delete-data">Delete information</label>
    <input type="button" id="delete-data" />
  </form>
  <p id="interaction-counter">Interactions: 0</p>

  <section>
    <h2>Saved users</h2>
    <ul id="user-list"></ul>
  </section>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
